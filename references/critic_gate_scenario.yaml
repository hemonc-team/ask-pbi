# Шаблон сценария для скилла critic-gate — гейт для аналитических выводов
# по этой Power BI модели (leads_marketing / KPI marketing view / clinic_ops).
#
# Когда обязателен: ответ содержит сравнение периодов, % конверсии, тренд,
# или причинно-следственную формулировку («выросло/упало потому что...»).
# Не обязателен: простой lookup одного числа без интерпретации.
#
# Как использовать: скопируй этот файл, заполни result_ref и acceptance_criteria
# под конкретный отчёт (AC1-AC5 — универсальные, оставляй всегда; добавляй
# специфичные под конкретные цифры этого отчёта), вызови скилл critic-gate
# с путём к заполненной копии.

task: "Проверить аналитические выводы отчёта по PBI-модели клиники перед отправкой пользователю"
result_ref: "<путь к черновику отчёта / текст выводов, который проверяем>"

primary_source:
  ref: "Power BI Service — датасеты leads_marketing и KPI marketing view (workspace 'Входящий трафик' 4b92027c-cc1d-460f-b48b-2b56f731408a и 'KPI Team' 8f13bfda-3032-42d9-ab87-5410016e5047)"
  access_channels:
    - "~/ask-pbi/scripts/pbi_run.sh execute-dax --group <ws_id> --dataset <ds_id> --query '<DAX>' (локально, на компьютере пользователя)"

# Универсальные критерии — держать во всех сценариях по этой модели.
# Специфичные критерии конкретного отчёта (например «конверсия в приём по кампании X») дописывать ниже с новым id.
acceptance_criteria:
  - id: AC1
    statement: >
      Каждое число, упомянутое в тексте выводов (.narr / итоговый ответ), присутствует
      в сыром результате выполненных DAX-запросов — не досчитано и не округлено произвольно.
    not_simulated: false

  - id: AC2
    statement: >
      Если в отчёте сравниваются два периода разной полноты (частичный месяц/неделя vs полный) —
      прямое сравнение сумм явно помечено как некорректное, и рядом приведена сопоставимая метрика
      (среднедневное значение, или период урезан до одинаковой длины).
    not_simulated: false

  - id: AC3
    statement: >
      Любой нестандартный join/маппинг, использованный для получения цифр (VAR+IN join между
      таблицами без прямой связи, region-прокси через city-бакет, поиск ID кампании по подстроке
      в URL, любое другое эвристическое сопоставление), явно назван в тексте как допущение,
      а не подан как прямой факт из модели.
    not_simulated: false

  - id: AC4
    statement: >
      Причинно-следственные формулировки («упало из-за X», «рост благодаря Y») подтверждены
      отдельным запросом/данными о X или Y; если подтверждения нет — формулировка помечена как
      гипотеза («вероятно», «стоит проверить»), а не как установленный факт.
    not_simulated: false

  - id: AC5
    statement: >
      Процент/доля не построен на знаменателе меньше 10 наблюдений без явной оговорки о низкой
      статистической значимости; деления на пустое/ноль не даны как «0%» без пометки.
    not_simulated: false

critics:
  - id: number_trace
    type: "Прослеживаемость чисел"
    channel: >
      Взять каждое число из текста выводов, самостоятельно выполнить эквивалентный DAX-запрос
      через pbi_run.sh execute-dax и сверить значение. Несовпадение = НЕ ПРОШЁЛ с уликой (какой
      запрос, что получил).
    covers: [AC1, AC5]

  - id: period_comparability
    type: "Сопоставимость периодов"
    channel: >
      Проверить календарные длины сравниваемых периодов (посчитать дни вручную). Если периоды
      разной длины/полноты — проверить, есть ли в тексте нормализованная метрика (среднедневная
      или урезанный период) рядом с сырыми суммами.
    covers: [AC2]

  - id: assumption_disclosure
    type: "Прозрачность допущений и join-логики"
    channel: >
      Прочитать DAX-запросы, которыми получены цифры отчёта (VAR/IN/SEARCH/CALCULATETABLE с
      нестандартными фильтрами), и сверить с текстом отчёта — названо ли это допущением.
    covers: [AC3]

  - id: causal_claims
    type: "Причинность без доказательств"
    channel: >
      Для каждого причинного утверждения в тексте — найти в предоставленных DAX-результатах
      прямое подтверждение причины; если нет — проверить формулировку на маркеры гипотезы.
    covers: [AC4]

gate:
  max_iterations: 2
  log_path: "" # заполнить путём к .jsonl логу при повторных прогонах одного отчёта
